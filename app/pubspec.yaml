name: wandoo
description: Ein Wesen, das nur wächst, wenn du neue Wege gehst.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.47.0"

dependencies:
  audioplayers: ^6.8.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_scene: ^0.24.3
  geo_engine:
    path: ../packages/geo_engine
  geolocator: ^14.1.1
  go_router: ^18.0.2
  home_widget: ^0.10.0
  latlong2: ^0.10.1
  meta: ^1.19.0
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  timezone: ^0.11.2
  vector_math: ^2.4.3

dev_dependencies:
  async: ^2.13.1
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/creatures/
    - assets/world/
    - assets/ui/
    - assets/sounds/
    - assets/bath/
    - assets/den/
  shaders:
    - lib/features/creature/presentation/shaders/creature.frag
