# Lokale Prüfungen vor jedem Commit. Einmalig: `lefthook install`.
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.dart"
      run: dart format --output=none --set-exit-if-changed {staged_files}
    architecture:
      run: dart tool/check_architecture.dart
    analyze:
      run: flutter analyze
