name: Test-APK

# Baut nach jedem Merge eine installierbare APK für Testgeräte.
# Download: GitHub > Actions > Test-APK > letzter Lauf > Artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/apk.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release-APK bauen (mit Debug-Schlüssel signiert)
        working-directory: app
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: wandoo-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
